name: Documentation
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'INSTALL.md'
      - 'examples/README.md'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'work/docs_site.py'
      - 'work/check_docs_links.py'
      - 'tests/test_docs_site.py'
      - '.github/workflows/docs.yml'
      - '.gitignore'
  pull_request:
    paths:
      - 'docs/**'
      - 'INSTALL.md'
      - 'examples/README.md'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'work/docs_site.py'
      - 'work/check_docs_links.py'
      - 'tests/test_docs_site.py'
      - '.github/workflows/docs.yml'
      - '.gitignore'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation tools
        run: python -m pip install -r requirements-docs.txt
      - name: Build and check documentation
        run: |
          python -m unittest tests.test_docs_site
          python -m mkdocs build --strict
          python -m work.check_docs_links
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .cache/docs-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require workflow-only Pages publishing
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.repos.getPages({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (data.build_type !== 'workflow') {
              core.setFailed('Set Settings → Pages → Source to GitHub Actions. Branch/Jekyll publishing can overwrite the MkDocs deployment.');
            }
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed MkDocs homepage
        uses: actions/github-script@v8
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const url = new URL(process.env.PAGES_URL);
            url.searchParams.set('deployment', String(context.runId));
            for (let attempt = 0; attempt < 6; attempt++) {
              const response = await fetch(url);
              const html = await response.text();
              if (response.ok && /name=["']generator["']\s+content=["']mkdocs-/i.test(html)) {
                core.info('Live homepage is served by MkDocs.');
                return;
              }
              if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('The deployed homepage is not MkDocs. Check Pages Source and competing branch/Jekyll deployments.');
