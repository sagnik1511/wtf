services:
  train:
    image: wtf:local
    build:
      context: .
      args:
        BUILD_NATIVE: '${WTF_BUILD_NATIVE:-1}'
    profiles: [train]
    user: '${WTF_UID:-1000}:${WTF_GID:-1000}'
    volumes:
      - ./results:/data/results
    command:
      - environments/baseline.json
      - --runs
      - '1'
      - --progress
      - --output
      - /data/results
  viewer:
    image: wtf:local
    build:
      context: .
      args:
        BUILD_NATIVE: '${WTF_BUILD_NATIVE:-1}'
    user: '${WTF_UID:-1000}:${WTF_GID:-1000}'
    entrypoint: [python, -m, wtf.server]
    command: [--host, 0.0.0.0, --port, '8000', --results, /data/results]
    ports:
      - '127.0.0.1:${WTF_PORT:-8000}:8000'
    volumes:
      - ./results:/data/results:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
