<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">Compact V7 and late consequence decisions</title><desc id="desc">Controlled viewer specimen · authored values, not learned outcomes or benchmark results</desc><style>.viewer-component text{font:12px system-ui,sans-serif;fill:#a9bacc}</style><rect class="sheet-background" width="1200" height="940" rx="14" fill="#0b1118"/><g class="sheet-heading"><text x="28" y="38" font-family="system-ui,sans-serif" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="600">Compact V7 and late consequence decisions</text><text x="28" y="67" font-family="system-ui,sans-serif" font-size="14" fill="#a9bacc" text-anchor="start">Controlled viewer specimen · authored values, not learned outcomes or benchmark results</text></g><rect x="28" y="95" width="545" height="810" rx="10" fill="#111c27" stroke="#415569"/><text x="48" y="132" font-family="system-ui,sans-serif" font-size="23" fill="#e6edf3" text-anchor="start">One saved observation: 211 values</text><text x="48" y="169" font-family="system-ui,sans-serif" font-size="16" fill="#a9bacc" text-anchor="start">Physical input trunk: 107 values</text><text x="48" y="189" font-family="system-ui,sans-serif" font-size="16" fill="#a9bacc" text-anchor="start">61 core + 42 movement summary + 4 blended scent</text><text x="48" y="209" font-family="system-ui,sans-serif" font-size="16" fill="#a9bacc" text-anchor="start"></text><text x="48" y="229" font-family="system-ui,sans-serif" font-size="16" fill="#a9bacc" text-anchor="start">Side-channel evidence: 104 values</text><text x="48" y="249" font-family="system-ui,sans-serif" font-size="16" fill="#a9bacc" text-anchor="start">24 local + 40 general + 40 context</text><text x="48" y="269" font-family="system-ui,sans-serif" font-size="16" fill="#a9bacc" text-anchor="start">Recorded with each sample; excluded from trunk weights.</text><rect x="48" y="315" width="505" height="200" rx="10" fill="#111c27" stroke="#415569"/><text x="68" y="349" font-family="system-ui,sans-serif" font-size="21" fill="#e6edf3" text-anchor="start">Four-value anonymous scent</text><text x="68" y="385" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="start">[forward=0, right=−1]</text><text x="68" y="405" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="start">[strength=.9, freshness=.4]</text><text x="68" y="425" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="start">Anonymous off-cell patch.</text><text x="68" y="445" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="start">Own older traces remain.</text><g class="viewer-component" transform="translate(385 351) scale(1.0714)"><circle cx="70" cy="70" r="43" fill="var(--viz-0b131c, #0b131c)" stroke="var(--viz-415569, #415569)"></circle><text x="70" y="18" text-anchor="middle">F</text><text x="125" y="75" text-anchor="middle">R</text><text x="70" y="132" text-anchor="middle">B</text><text x="15" y="75" text-anchor="middle">L</text><circle cx="70" cy="70" r="3" fill="var(--viz-fff, #fff)"></circle><line x1="70" y1="70" x2="32" y2="70" stroke="var(--viz-7de2bd, #7de2bd)" stroke-width="2" opacity="0.55"></line><circle cx="32" cy="70" r="4" fill="var(--viz-7de2bd, #7de2bd)"></circle></g><rect x="48" y="537" width="505" height="205" rx="10" fill="#111c27" stroke="#415569"/><text x="68" y="573" font-family="system-ui,sans-serif" font-size="21" fill="#e6edf3" text-anchor="start">Seven-value movement summary per track</text><text x="68" y="609" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="start">Last position: forward/right</text><text x="68" y="629" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="start">Trend velocity: forward/right</text><text x="68" y="649" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="start">Freshness, visible now, motion reliability</text><text x="68" y="669" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="start"></text><text x="68" y="689" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="start">Only personal sightings; no hidden path extrapolation.</text><text x="68" y="709" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="start">The summary does not retain every historical turn.</text><text x="48" y="789" font-family="system-ui,sans-serif" font-size="16" fill="#a9bacc" text-anchor="start">V1–V6 retain their original layouts and artifacts.</text><text x="48" y="809" font-family="system-ui,sans-serif" font-size="16" fill="#a9bacc" text-anchor="start">V7 requires matching new model weights.</text><text x="48" y="829" font-family="system-ui,sans-serif" font-size="16" fill="#a9bacc" text-anchor="start">Ordinary PPO remains unmasked.</text><text x="48" y="849" font-family="system-ui,sans-serif" font-size="16" fill="#a9bacc" text-anchor="start">Scent and history remain optional.</text><rect x="601" y="95" width="571" height="810" rx="10" fill="#111c27" stroke="#415569"/><text x="623" y="132" font-family="system-ui,sans-serif" font-size="23" fill="#e6edf3" text-anchor="start">Inspector: learned consequence adjustment</text><text x="623" y="169" font-family="system-ui,sans-serif" font-size="16" fill="#a9bacc" text-anchor="start">Private physical network proposes base action logits.</text><text x="623" y="189" font-family="system-ui,sans-serif" font-size="16" fill="#a9bacc" text-anchor="start">A private adapter evaluates saved outcome evidence.</text><text x="623" y="209" font-family="system-ui,sans-serif" font-size="16" fill="#a9bacc" text-anchor="start">Bounded learned residuals adjust the logits.</text><text x="623" y="229" font-family="system-ui,sans-serif" font-size="16" fill="#a9bacc" text-anchor="start">Final probabilities drive both sampling and PPO loss.</text><g class="viewer-component" transform="translate(623 290) scale(1.5918)"><text x="2" y="15">move forward</text><rect x="210" y="5" width="0" height="12" fill="var(--viz-7de2bd, #7de2bd)"></rect><text x="316" y="15" text-anchor="end">0.000</text><text x="2" y="38">move backward</text><rect x="210" y="28" width="0" height="12" fill="var(--viz-7de2bd, #7de2bd)"></rect><text x="316" y="38" text-anchor="end">0.000</text><text x="2" y="61">strafe left</text><rect x="210" y="51" width="0" height="12" fill="var(--viz-7de2bd, #7de2bd)"></rect><text x="316" y="61" text-anchor="end">0.000</text><text x="2" y="84">strafe right</text><rect x="210" y="74" width="0" height="12" fill="var(--viz-7de2bd, #7de2bd)"></rect><text x="316" y="84" text-anchor="end">0.000</text><text x="2" y="107">turn left</text><rect x="210" y="97" width="0" height="12" fill="var(--viz-7de2bd, #7de2bd)"></rect><text x="316" y="107" text-anchor="end">0.000</text><text x="2" y="130">turn right</text><rect x="210" y="120" width="0" height="12" fill="var(--viz-7de2bd, #7de2bd)"></rect><text x="316" y="130" text-anchor="end">0.000</text><text x="2" y="153">rest</text><rect x="210" y="143" width="0" height="12" fill="var(--viz-7de2bd, #7de2bd)"></rect><text x="316" y="153" text-anchor="end">0.000</text><text x="2" y="176">eat</text><rect x="210" y="166" width="56.25" height="12" fill="var(--viz-7de2bd, #7de2bd)"></rect><text x="316" y="176" text-anchor="end">0.600</text><text x="2" y="199">reproduce</text><rect x="210" y="189" width="0" height="12" fill="var(--viz-7de2bd, #7de2bd)"></rect><text x="316" y="199" text-anchor="end">0.000</text><text x="2" y="222">swim</text><rect x="135" y="212" width="75" height="12" fill="var(--viz-ff9aab, #ff9aab)"></rect><text x="316" y="222" text-anchor="end">-0.800</text></g><text x="623" y="735" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="start">Green raises a logit; red lowers it.</text><text x="623" y="755" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="start">These illustrative bars come from the viewer component.</text><text x="623" y="775" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="start">Zero evidence gives an exact zero residual.</text><text x="623" y="795" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="start">No fixed rule says feeding/birth must win over harm.</text><text x="623" y="815" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="start">The actor KL gate commits or rejects both updates.</text><text x="623" y="835" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="start">Published counts are shared; learned weights are private.</text><style>/* Shared source for standalone viewer/inspector SVG specimens. */
