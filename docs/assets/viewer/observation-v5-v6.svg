<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1230" viewBox="0 0 1200 1230" role="img" aria-labelledby="title desc"><title id="title">Observation data: earlier V5 → current V6</title><desc id="desc">The same sensed scene, represented differently · default knots · illustrative values rounded for display</desc><style>.viewer-component text{font:12px system-ui,sans-serif;fill:#a9bacc}</style><rect class="sheet-background" width="1200" height="1230" rx="14" fill="#0b1118"/><g class="sheet-heading"><text x="28" y="38" font-family="system-ui,sans-serif" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="600">Observation data: earlier V5 → current V6</text><text x="28" y="67" font-family="system-ui,sans-serif" font-size="14" fill="#a9bacc" text-anchor="start">The same sensed scene, represented differently · default knots · illustrative values rounded for display</text></g><rect x="28" y="96" width="550" height="58" rx="10" fill="#111c27" stroke="#415569"/><text x="48" y="133" font-family="system-ui,sans-serif" font-size="23" fill="#e6edf3" text-anchor="start">EARLIER · V5 normalized numeric inputs</text><rect x="622" y="96" width="550" height="58" rx="10" fill="#111c27" stroke="#415569"/><text x="642" y="133" font-family="system-ui,sans-serif" font-size="23" fill="#e6edf3" text-anchor="start">NOW · V6 overlapping soft categories</text><rect x="28" y="172" width="550" height="92" rx="10" fill="#111c27" stroke="#415569"/><rect x="622" y="172" width="550" height="92" rx="10" fill="#111c27" stroke="#415569"/><text x="48" y="201" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Energy: one scalar</text><text x="48" y="221" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">0.40</text><text x="642" y="201" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Energy: four memberships [0, 0.7, 0.3, 0]</text><text x="642" y="221" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">critical · hungry · comfortable · full</text><text x="600" y="224" font-family="system-ui,sans-serif" font-size="24" fill="#7de2bd" text-anchor="middle">→</text><rect x="28" y="280" width="550" height="92" rx="10" fill="#111c27" stroke="#415569"/><rect x="622" y="280" width="550" height="92" rx="10" fill="#111c27" stroke="#415569"/><text x="48" y="309" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Health: one scalar</text><text x="48" y="329" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">0.90</text><text x="642" y="309" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Health: three memberships [0, 0.2, 0.8]</text><text x="642" y="329" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">critical · weak · healthy</text><text x="600" y="332" font-family="system-ui,sans-serif" font-size="24" fill="#7de2bd" text-anchor="middle">→</text><rect x="28" y="388" width="550" height="181" rx="10" fill="#111c27" stroke="#415569"/><rect x="622" y="388" width="550" height="181" rx="10" fill="#111c27" stroke="#415569"/><text x="48" y="417" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">One visible food slot: four scalars</text><text x="48" y="437" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">forward ≈ 0.0728; right ≈ −0.0529</text><text x="48" y="457" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">distance = 0.09; present = 1</text><text x="48" y="477" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start"></text><text x="48" y="497" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Current body-relative position, not a hidden target.</text><text x="642" y="417" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Same slot: 12 channels</text><text x="642" y="437" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">range [near, medium, far] = [0.7, 0.3, 0]</text><text x="642" y="457" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">bearing [F, FR, R, BR, B, BL, L, FL]</text><text x="642" y="477" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">= [0.2, 0, 0, 0, 0, 0, 0, 0.8]; present = 1</text><text x="642" y="497" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Same individual slot; no averaging of targets.</text><text x="600" y="484.5" font-family="system-ui,sans-serif" font-size="24" fill="#7de2bd" text-anchor="middle">→</text><rect x="28" y="585" width="550" height="102" rx="10" fill="#111c27" stroke="#415569"/><rect x="622" y="585" width="550" height="102" rx="10" fill="#111c27" stroke="#415569"/><text x="48" y="614" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Exact flags / raw values</text><text x="48" y="634" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Presence, heading, sex, blocked cells, readiness,</text><text x="48" y="654" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">opportunities, seen and consenting-pair flags</text><text x="642" y="614" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Exact flags / raw values stay unchanged</text><text x="642" y="634" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Presence still distinguishes an absent slot.</text><text x="642" y="654" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Absent slot: range + bearings + presence are all zero.</text><text x="600" y="642" font-family="system-ui,sans-serif" font-size="24" fill="#7de2bd" text-anchor="middle">→</text><rect x="28" y="705" width="1144" height="370" rx="10" fill="#111c27" stroke="#415569"/><text x="48" y="741" font-family="system-ui,sans-serif" font-size="22" fill="#e6edf3" text-anchor="start">Channel counts · matched optional settings, not extra sensing</text><text x="890" y="754" font-family="system-ui,sans-serif" font-size="16" fill="#a9bacc" text-anchor="middle">V5</text><text x="1080" y="754" font-family="system-ui,sans-serif" font-size="16" fill="#7de2bd" text-anchor="middle">V6</text><text x="48" y="790" font-family="system-ui,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start">Core (k=3): own state, targets, terrain, mating, opportunities</text><text x="890" y="790" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="middle">72</text><text x="1080" y="790" font-family="system-ui,sans-serif" font-size="15" fill="#7de2bd" text-anchor="middle">202</text><text x="48" y="827" font-family="system-ui,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start">Movement history (H steps; optional)</text><text x="890" y="827" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="middle">2k × (7 + 3H)</text><text x="1080" y="827" font-family="system-ui,sans-serif" font-size="15" fill="#7de2bd" text-anchor="middle">2k × (29 + 12H)</text><text x="48" y="864" font-family="system-ui,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start">Scent (C channels; optional)</text><text x="890" y="864" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="middle">9C</text><text x="1080" y="864" font-family="system-ui,sans-serif" font-size="15" fill="#7de2bd" text-anchor="middle">27C</text><text x="48" y="901" font-family="system-ui,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start">Local visible outcomes (optional)</text><text x="890" y="901" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="middle">24</text><text x="1080" y="901" font-family="system-ui,sans-serif" font-size="15" fill="#7de2bd" text-anchor="middle">108</text><text x="48" y="938" font-family="system-ui,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start">Each consequence scope (optional)</text><text x="890" y="938" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="middle">48</text><text x="1080" y="938" font-family="system-ui,sans-serif" font-size="15" fill="#7de2bd" text-anchor="middle">216</text><text x="48" y="975" font-family="system-ui,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start">Matched prey total: history/scent off, social + both scopes</text><text x="890" y="975" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="middle">192</text><text x="1080" y="975" font-family="system-ui,sans-serif" font-size="15" fill="#7de2bd" text-anchor="middle">742</text><text x="48" y="1012" font-family="system-ui,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start">Matched predator total: same flags, k=10</text><text x="890" y="1012" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="middle">276</text><text x="1080" y="1012" font-family="system-ui,sans-serif" font-size="15" fill="#7de2bd" text-anchor="middle">994</text><rect x="28" y="1093" width="1144" height="109" rx="10" fill="#111c27" stroke="#415569"/><text x="48" y="1125" font-family="system-ui,sans-serif" font-size="20" fill="#e6edf3" text-anchor="start">Two separate changes</text><text x="48" y="1152" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="start">V5 → V6 expands/re-encodes the input. In-band scalar hats reconstruct values; out-of-band values saturate.</text><text x="48" y="1172" font-family="system-ui,sans-serif" font-size="15" fill="#a9bacc" text-anchor="start">The later V6 speed/memory optimization changes no input data: identical values, order, widths and replay bytes.</text><style>/* Shared source for stan