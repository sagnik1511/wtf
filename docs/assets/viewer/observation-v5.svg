<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Observation V5: body-relative inputs, world-relative diagrams</title><desc id="desc">Controlled input/renderer demonstration; example probabilities are authored, not experimental results</desc><style>.viewer-component text{font:12px system-ui,sans-serif;fill:#a9bacc}</style><rect class="sheet-background" width="1200" height="660" rx="14" fill="#0b1118"/><g class="sheet-heading"><text x="28" y="38" font-family="system-ui,sans-serif" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="600">Observation V5: body-relative inputs, world-relative diagrams</text><text x="28" y="67" font-family="system-ui,sans-serif" font-size="14" fill="#a9bacc" text-anchor="start">Controlled input/renderer demonstration; example probabilities are authored, not experimental results</text></g><rect x="28" y="95" width="545" height="225" rx="10" fill="#111c27" stroke="#415569"/><text x="48" y="125" font-family="system-ui,sans-serif" font-size="22" fill="#e6edf3" text-anchor="start">V4 · world-axis target vector</text><text x="48" y="164" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Heading: east</text><text x="48" y="184" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Prey: dx = 1/11, dy = -1/11</text><text x="48" y="204" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">The network combines heading and position.</text><text x="48" y="224" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Base width: 45 + 12 × (k − 1)</text><rect x="28" y="344" width="545" height="285" rx="10" fill="#111c27" stroke="#415569"/><text x="48" y="376" font-family="system-ui,sans-serif" font-size="22" fill="#e6edf3" text-anchor="start">V5 · forward/right target vector</text><text x="48" y="417" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Same prey: forward = 1/11, right = -1/11</text><text x="48" y="437" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Negative right means left of the animal.</text><text x="48" y="457" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Attack / eat / swim opportunities: 0 / 0 / 0</text><text x="48" y="477" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Base width: 48 + 12 × (k − 1)</text><text x="48" y="497" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Optional memory and scent rotate consistently.</text><text x="48" y="517" font-family="system-ui,sans-serif" font-size="17" fill="#a9bacc" text-anchor="start">Brains remain independent; PPO is unmasked.</text><rect x="601" y="95" width="571" height="534" rx="10" fill="#111c27" stroke="#415569"/><text x="625" y="132" font-family="system-ui,sans-serif" font-size="22" fill="#e6edf3" text-anchor="start">Agent inspector · facing east</text><g class="viewer-component" transform="translate(650 170) scale(1.6786)"><circle cx="140" cy="94" r="76" fill="var(--viz-0b131c, #0b131c)" stroke="var(--viz-415569, #415569)"></circle><path d="M 140 94 L 159.67024742779157 20.589637202030815 A 76 76 0 0 1 159.67024742779157 167.41036279796919 Z" fill="var(--viz-8ac8ff22, #8ac8ff22)" stroke="var(--viz-8ac8ff88, #8ac8ff88)" data-visual-field="150"></path><line x1="64" y1="94" x2="216" y2="94" stroke="var(--viz-263341, #263341)"></line><line x1="140" y1="18" x2="140" y2="170" stroke="var(--viz-263341, #263341)"></line><circle cx="140" cy="94" r="55.27272727272727" fill="none" stroke="var(--viz-8ac8ff88, #8ac8ff88)" stroke-dasharray="3 4"></circle><text x="140" y="12" text-anchor="middle">N</text><text x="225" y="98">E</text><circle cx="146.9090909090909" cy="87.0909090909091" r="4" fill="var(--viz-7de2bd, #7de2bd)" stroke="var(--viz-7de2bd, #7de2bd)"><title>prey slot 1: relative (0.091, -0.091), distance 0.129</title></circle><line x1="140" y1="94" x2="152" y2="94" stroke="var(--viz-fff, #fff)" stroke-width="2"></line><circle cx="140" cy="94" r="2.5" fill="var(--viz-fff, #fff)"></circle><text x="140" y="190" text-anchor="middle">Blue sector = front 150° sight</text></g><text x="625" y="550" font-family="system-ui,sans-serif" font-size="16" fill="#a9bacc" text-anchor="start">Raw features use forward/right labels.</text><text x="625" y="570" font-family="system-ui,sans-serif" font-size="16" fill="#a9bacc" text-anchor="start">Radar, history and scent diagrams face north.</text><text x="625" y="590" font-family="system-ui,sans-serif" font-size="16" fill="#a9bacc" text-anchor="start">The selected board overlay keeps world geometry.</text><style>/* Shared source for standalone viewer/inspector SVG specimens. */
