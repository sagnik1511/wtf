<div id="wtf-physics-explainer">
  <style>
    #wtf-physics-explainer {display:flex;flex-direction:column;gap:calc(var(--font-size-base)*.8);color:var(--foreground)}
    #wtf-physics-explainer canvas {display:block;width:100%;touch-action:manipulation}
    #wtf-physics-explainer .legend {display:flex;flex-wrap:wrap;gap:calc(var(--font-size-base)*.8);align-items:center}
    #wtf-physics-explainer .swatch {display:inline-block;width:.8em;height:.8em;vertical-align:middle;margin-right:.35em}
    #wtf-physics-explainer .values {display:flex;gap:calc(var(--font-size-base)*.7);flex-wrap:wrap;align-items:center}
    #wtf-physics-explainer .coordinate {max-width:8em}
    #wtf-physics-explainer [hidden] {display:none!important}
    #wtf-physics-explainer details>summary {color:var(--foreground)}
    #wtf-physics-explainer .palette {position:absolute;visibility:hidden;pointer-events:none}
  </style>
  <h2>World physics, one rule at a time</h2>
  <div class="viz-controls">
    <label class="form-label">Rule<select class="form-select" id="wtf-rule"><option value="sight">Visibility</option><option value="water">Swimming &amp; current</option><option value="height">Elevation</option><option value="birth">Reproduction</option></select></label>
    <label class="form-label">Animal<select class="form-select" id="wtf-animal"><option value="prey">Prey · DQN</option><option value="predator">Predator · PPO</option></select></label>
  </div>
  <div id="wtf-sight-controls">
    <div class="viz-controls">
      <label class="form-label">Terrain<select class="form-select" id="wtf-scene"><option value="example">Three-cell river · example</option><option value="valley">Valley left gate · actual terrain crop</option></select></label>
      <label class="form-check"><input class="form-check-input" type="checkbox" id="wtf-bonus" checked><span class="form-check-label">Water sight bonus enabled</span></label>
    </div>
    <div class="viz-row">
      <button class="btn" type="button" id="wtf-across">Across river</button><button class="btn" type="button" id="wtf-dry">Dry direction</button><button class="btn" type="button" id="wtf-wall">Behind wall</button>
      <label class="form-label coordinate">Target x<input class="form-control" id="wtf-x" type="number" min="0" max="22" value="16"></label>
      <label class="form-label coordinate">Target y<input class="form-control" id="wtf-y" type="number" min="0" max="12" value="6"></label>
    </div>
  </div>
  <div id="wtf-water-controls" hidden class="viz-controls">
    <label class="form-label">Chosen action<select class="form-select" id="wtf-action"><option value="swim">Swim toward water</option><option value="move_forward">Walk toward water</option><option value="rest">Rest in water</option></select></label>
    <label class="form-check"><input class="form-check-input" type="checkbox" id="wtf-weak"><span class="form-check-label">Low health · 10 HP</span></label>
  </div>
  <div id="wtf-height-controls" hidden class="viz-controls">
    <label class="form-label">Slope<select class="form-select" id="wtf-slope"><option value="1">Uphill +1</option><option value="2">Cliff +2</option><option value="-1">Downhill −1</option></select></label>
  </div>
  <div id="wtf-birth-controls" hidden class="viz-controls">
    <label class="form-label">Parent separation<select class="form-select" id="wtf-distance"><option value="1">1 cell</option><option value="2" selected>2 cells</option><option value="3">3 cells</option><option value="4">4 cells</option></select></label>
    <label class="form-check"><input class="form-check-input" type="checkbox" id="wtf-consent" checked><span class="form-check-label">Both parents choose reproduce</span></label>
  </div>
  <div id="wtf-timeline" hidden class="viz-row">
    <label class="form-label">Step <output id="wtf-tick-value" class="tabular-nums">0</output><input class="form-range" id="wtf-tick" type="range" min="0" max="8" step="1" value="0"></label>
    <button class="btn btn-primary" id="wtf-step" type="button">Next step</button>
  </div>
  <canvas id="wtf-board" role="img" aria-label="Interactive grid showing the current visibility and physics rule">Grid showing observer A, target B, water, walls and physical movement.</canvas>
  <div id="wtf-status" class="tabular-nums" role="status" aria-live="polite"></div>
  <div class="legend text-small" id="wtf-legend"></div>
  <details>
    <summary>All visibility and interaction rules</summary>
    <table class="table table-sm"><tbody id="wtf-rules"></tbody></table>
  </details>
  <div class="palette" aria-hidden="true"><span id="wtf-c1" style="color:var(--viz-series-1)"></span><span id="wtf-c2" style="color:var(--viz-series-2)"></span><span id="wtf-c3" style="color:var(--viz-series-3)"></span><span id="wtf-c4" style="color:var(--viz-series-4)"></span><span id="wtf-cfg" style="color:var(--foreground)"></span><span id="wtf-cbg" style="color:var(--background)"></span><span id="wtf-cborder" style="color:var(--border)"></span></div>
</div>

 else if(state.rule==='water'){m=terrain(DATA.swimRows,DATA.swimLegend);view={x:0,y:0,w:20,h:12};const states=DATA.swim[state.animal][state.action+(state.weak?'_weak':'')];st=states[state.tick];observer=[st.x,st.y];path=states.slice(0,state.tick+1).map(s=>[s.x,s.y]);extra={st};}
 else if(state.rule==='height'){const e=DATA.elevation[state.animal][state.slope];m=terrain(e.rows,e.legend);view={x:0,y:0,w:20,h:10};st=e.states[Math.min(1,state.tick)];observer=[st.x,st.y];target=[8,5];path=e.states.slice(0,Math.min(1,state.tick)+1).map(s=>[s.x,s.y]);extra={st};}
 else {m=terrain(Array(11).fill('.'.repeat(20)),{'.':{}});view={x:0,y:0,w:20,h:11};observer=[7,5];target=[7+Number(state.distance),5];extra=DATA.mating[state.animal][state.distance+'_'+Number(state.consent)];}
 return {m,view,observer,target,path,body,spec,extra,st};}
function render(){const valid=['sight','water','height','birth'];if(!valid.includes(state.rule))state.rule='sight';if(!DATA.species[state.animal])state.animal='prey';if(!['example','valley'].includes(state.scene))state.scene='example';if(!['move_forward','swim','rest'].includes(state.action))state.action='swim';if(!['1','2','-1'].includes(String(state.slope)))state.slope='1';if(!['1','2','3','4'].includes(String(state.distance)))state.distance='2';state.tick=Math.max(0,Math.min(state.rule==='height'?1:8,Math.round(Number(state.tick)||0)));
 const o=context();geometry=o;
 for(const name of ['sight','water','height','birth'])q(name+'-controls').hidden=state.rule!==name;
 q('timeline').hidden=!['water','height'].includes(state.rule);q('tick').max=state.rule==='height'?1:8;q('tick').value=state.tick;q('tick-value').value=state.tick;q('tick-value').textContent=state.tick;q('step').disabled=state.tick>=Number(q('tick').max);
 for(const key of ['rule','animal','scene','action','slope','distance'])q(key).value=state[key];for(const key of ['bonus','weak','consent'])q(key).checked=!!state[key];
 q('x').min=o.view.x;q('x').max=o.view.x+o.view.w-1;q('y').min=o.view.y;q('y').max=o.view.y+o.view.h-1;q('x').value=state.x;q('y').value=state.y;
 const c=colors();let status,legend=[];
 if(state.rule==='sight'){const e=o.extra;status=(e.blocked?'Wall blocks sight':e.seen?(e.old?'Visible within normal range':'Newly visible across water'):'Beyond directional sight range')+' · distance '+e.distance.toFixed(2)+' · intervening water '+e.water+' · limit '+e.limit+' cells';legend=[['1','Normal sight'],['2','Added water sight'],['3','River'],['fg','Wall'],[null,'A observer · B target']];}
 else if(state.rule==='birth'){const e=o.extra;status=(e.born?'Child born':!state.consent?'No birth: both choices required':'No birth: outside radius 2')+' · parent energy '+e.energies.map(v=>v.toFixed(2)).join(' / ');legend=[['1','F / M: mature, healthy same-species parents'],['4','C: child'],[null,'Dashed ring: mating radius 2']];}
 else {const s=o.extra.st, events=s.events;let tag='Initial state';if(state.tick){tag=events.some(e=>e.kind==='died')||!s.alive?'Died':events.some(e=>e.kind==='movement_blocked')?'Movement blocked':events.some(e=>e.kind==='drifted')?'Current drift':events.some(e=>e.kind==='moved')?'Moved':'Stayed';}status=tag+' · energy '+s.energy.toFixed(3)+' · health '+s.health.toFixed(1)+(state.rule==='water'?' · current carry ('+s.dx.toFixed(2)+', '+s.dy.toFixed(2)+')':'');legend=state.rule==='water'?[['1','Animal and travelled path'],['3','River · current (+0.4, +0.75) / step']]:[['1','Animal and travelled path'],[null,'Height: left '+(Number(state.slope)<0?1:0)+' → right '+(Number(state.slope)<0?0:state.slope)]];}
 q('status').textContent=status;q('legend').replaceChildren(...legend.map(([col,label])=>{const el=document.createElement('span');if(col){const mark=document.createElement('i');mark.className='swatch';mark.style.background=c[col];mark.style.opacity=col==='fg'?'.45':'1';el.append(mark);}el.append(document.createTextNode(label));return el;}));
 const b=o.body,l=o.spec.locomotion,r=o.spec.reproduction;
 const rows=[['Vision','360° · Euclidean distance · integer line-of-sight rays'],['Occlusion','Walls block sight; elevation and animals do not'],['Water sight',b.vision_radius+' normal; up to '+(b.vision_radius+b.water_vision_bonus)+' across intervening water'],['Brain input','32 values · body/heading · 4 blocked neighbors · nearest food/prey/predator · 12 terrain values'],['Target encoding','One nearest accepted target per class; water-mode distances normalized by maximum radius'],['Walking','One cell forward; water requires swim; occupied cells block movement'],['Swim requirement','Health ≥ '+l.swim_min_health+' × depth; energy strictly greater than stroke + uphill cost'],['Energy / step','Living '+b.living_cost+'; movement attempt '+b.movement_cost+'; stroke '+l.swim_energy_cost+' × depth; water '+l.water_energy_cost+' × depth'],['Elevation','Max climb '+l.max_climb+'; uphill '+l.uphill_energy_cost+' energy / height; downhill has no extra cost or refund'],['Current','Fractional x/y carry; collisions and corner walls stop drift; dry landing clears carry'],['Health','No passive HP decay or regeneration; starvation, attacks and drowning deal damage'],['Drowning','In water: weak, exhausted or unable to swim → '+l.drowning_damage+' damage × depth / step'],['Birth eligibility','Same species, opposite sexes, both choices, range 2, line of sight, dry route and free child cell'],['Birth gates','Mature at '+r.min_age_steps+' ±10%; cooldown '+r.cooldown_steps+' ±10%; health > '+r.health_threshold+'; energy ≥ '+r.min_energy],['Birth costs','Each parent spends '+r.energy_cost+' energy; no direct HP charge; child starts with '+b.initial_energy+' energy / '+b.max_health+' HP'],['Inheritance','Mix parents’ weights; rare newborn-only mutation; independent training state'],['Failed birth','No birth cost or cooldown; normal living cost and failed-action reward still apply'],['Reward feedback','−0.01 / energy demand · −0.05 / failed action · +1 / successful parent'],['Other actions','Attack: front cell only; eat: current cell or front cell'],['Step order','Movement → current → eat/attack → costs/damage/death → birth → food growth']];
 q('rules').replaceChildren(...rows.map(([key,value])=>{const tr=document.createElement('tr'),th=document.createElement('th'),td=document.createElement('td');th.scope='row';th.textContent=key;td.textContent=value;tr.append(th,td);return tr;}));
 canvas.setAttribute('aria-label',state.rule+' grid. '+status);draw(o,c);
}
function draw(o,c){const width=Math.max(280,root.clientWidth),pad=22,cell=Math.min(28,(width-2*pad)/o.view.w),height=o.view.h*cell+2*pad,dpr=window.devicePixelRatio||1;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.height=height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);const ox=(width-o.view.w*cell)/2,oy=pad;geometry={...o,cell,ox,oy};const p=([x,y])=>[ox+(x-o.view.x+.5)*cell,oy+(y-o.view.y+.5)*cell];
 const rect=(x,y,fill,alpha=1)=>{ctx.globalAlpha=alpha;ctx.fillStyle=fill;ctx.fillRect(ox+(x-o.view.x)*cell,oy+(y-o.view.y)*cell,cell,cell);ctx.globalAlpha=1;};
 for(let y=o.view.y;y<o.view.y+o.view.h;y++)for(let x=o.view.x;x<o.view.x+o.view.w;x++){const t=tile(o.m,x,y);if(t.water_depth)rect(x,y,c['3'],.18);else if(t.elevation)rect(x,y,c.fg,.04+.035*t.elevation);if(t.blocked)rect(x,y,c.fg,.48);else if(state.rule==='sight'){const e=sight(o.m,o.observer,[x,y],o.body.vision_radius,state.bonus?o.body.water_vision_bonus:0);if(e.old)rect(x,y,c['1'],.11);else if(e.seen)rect(x,y,c['2'],.32);}}
 ctx.strokeStyle=c.border;ctx.lineWidth=.5;ctx.beginPath();for(let x=0;x<=o.view.w;x++){ctx.moveTo(ox+x*cell,oy);ctx.lineTo(ox+x*cell,oy+o.view.h*cell);}for(let y=0;y<=o.view.h;y++){ctx.moveTo(ox,oy+y*cell);ctx.lineTo(ox+o.view.w*cell,oy+y*cell);}ctx.stroke();
 const f=getComputedStyle(root);ctx.font='400 '+(parseFloat(f.fontSize)||14)+'px '+f.fontFamily;ctx.fillStyle=c.fg;ctx.textAlign='center';for(let x=o.view.x;x<o.view.x+o.view.w;x+=5)ctx.fillText(String(x),p([x,o.view.y])[0],oy-7);ctx.textAlign='right';for(let y=o.view.y;y<o.view.y+o.view.h;y+=3)ctx.fillText(String(y),ox-7,p([o.view.x,y])[1]+4);
 function line(points,color,dashed=false){if(points.length<2)return;ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash(dashed?[4,4]:[]);ctx.beginPath();points.forEach((xy,i)=>{const z=p(xy);i?ctx.lineTo(...z):ctx.moveTo(...z);});ctx.stroke();ctx.setLineDash([]);}
 function ring(at,r){const[x,y]=p(at);ctx.strokeStyle=c.fg;ctx.globalAlpha=.45;ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(x,y,r*cell,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;}
 function mark(at,label,color,diamond=false,below=false){const[x,y]=p(at),r=Math.max(4,Math.min(8,cell*.3));ctx.fillStyle=color;ctx.beginPath();if(diamond){ctx.moveTo(x,y-r);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y);ctx.closePath();}else ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.fillStyle=c.fg;ctx.textAlign='center';ctx.fillText(label,x,y+(below?21:-12));}
 if(state.rule==='sight'){ring(o.observer,o.body.vision_radius);const e=o.extra;line([o.observer,...e.cells],e.seen?c['2']:c.fg,!e.seen);mark(o.observer,'A',c['1']);mark(o.target,'B',c.fg,true);}
 else if(state.rule==='birth'){ring(o.observer,2);line([o.observer,o.target],c.fg,true);mark(o.observer,'F',c['1']);mark(o.target,'M',c['1'],false,true);if(o.extra.child)mark([o.extra.child.x,o.extra.child.y],'C',c['4'],true);}
 else {line(o.path,c['1']);mark(o.observer,o.st.alive?'A':'×',c['1']);if(state.rule==='water'){ctx.strokeStyle=c['3'];ctx.lineWidth=1.3;for(let y=1;y<o.m.height;y+=3)for(let x=9;x<=12;x+=2){const[u,v]=p([x,y]);ctx.beginPath();ctx.moveTo(u-3,v-6);ctx.lineTo(u+3,v+5);ctx.lineTo(u-2,v+3);ctx.moveTo(u+3,v+5);ctx.lineTo(u+4,v);ctx.stroke();}}else{ctx.textAlign='center';ctx.fillStyle=c.fg;ctx.fillText('h '+(Number(state.slope)<0?1:0),p([4,2])[0],p([4,2])[1]);ctx.fillText('h '+(Number(state.slope)<0?0:state.slope),p([13,2])[0],p([13,2])[1]);}}
}
for(const key of ['rule','animal','action','slope','distance'])q(key).addEventListener('change',e=>set({[key]:e.target.value,tick:0}));
q('scene').addEventListener('change',e=>set({scene:e.target.value,...(e.target.value==='valley'?{x:3,y:13}:{x:16,y:6})}));
for(const key of ['bonus','weak','consent'])q(key).addEventListener('change',e=>set({[key]:e.target.checked,tick:0}));
for(const key of ['x','y'])q(key).addEventListener('change',e=>set({[key]:Number(e.target.value)}));
q('tick').addEventListener('input',e=>set({tick:Number(e.target.value)}));q('step').addEventListener('click',()=>set({tick:Math.min(state.tick+1,Number(q('tick').max))}));
for(const kind of ['across','dry','wall'])q(kind).addEventListener('click',()=>{const a=state.scene==='valley'?{across:[3,13],dry:[17,13],wall:[6,10]}:{across:[16,6],dry:[0,6],wall:[15,3]};set({x:a[kind][0],y:a[kind][1]});});
canvas.addEventListener('click',e=>{if(state.rule!=='sight'||!geometry)return;const r=canvas.getBoundingClientRect(),g=geometry,x=Math.floor((e.clientX-r.left-g.ox)/g.cell)+g.view.x,y=Math.floor((e.clientY-r.top-g.oy)/g.cell)+g.view.y;if(x>=g.view.x&&x<g.view.x+g.view.w&&y>=g.view.y&&y<g.view.y+g.view.h)set({x,y});});
new ResizeObserver(()=>render()).observe(root);new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['class','data-theme','style']});window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){hydrate(e.detail.globals.widgetState);render();}});render();
})();
