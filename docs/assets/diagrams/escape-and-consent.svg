<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">Learned escape directions and visible mating consent</title>
<desc id="desc">A north-facing animal can step backward, left or right without turning. Its own consent and a visible mate's consent enter observation version four; mating remains within radius two.</desc>
