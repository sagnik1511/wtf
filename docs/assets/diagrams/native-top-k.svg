<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc">
<style>svg{--figure-bg:#f8fafc;--figure-panel:#fff;--figure-ink:#172b45;--figure-muted:#52657b;--figure-border:#8ca0b7;--figure-native:#e4f2ee;}@media(prefers-color-scheme:dark){svg{--figure-bg:#171b22;--figure-panel:#26313e;--figure-ink:#e5eaf1;--figure-muted:#b2bfce;--figure-border:#879db4;--figure-native:#183c35;}}</style>
<title id="title">Native top-k perception ownership and numerical boundary</title><desc id="desc">Python owns spatial revisions and cached results. On an eligible cache miss, C collects and sorts query-local candidates, checks occlusion and water range, then returns offsets. Python computes normalized features and exact math.hypot values. No native state is retained.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="var(--figure-muted)"/></marker></defs>
<rect width="1000" height="290" rx="12" fill="var(--figure-bg)"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="var(--figure-ink)">
<text x="500" y="34" font-size="22" font-weight="700">Accelerate selection; preserve Python feature arithmetic</text>
<rect x="260" y="66" width="480" height="137" rx="12" fill="var(--figure-native)"/>
<text x="500" y="86" font-size="13">Optional C kernel · query-local storage</text>
<g fill="var(--figure-panel)" stroke="var(--figure-border)" stroke-width="1.5"><rect x="20" y="99" width="210" height="90" rx="8"/><rect x="270" y="99" width="210" height="90" rx="8"/><rect x="520" y="99" width="210" height="90" rx="8"/><rect x="770" y="99" width="210" height="90" rx="8"/></g>
<g font-size="17" font-weight="600"><text x="125" y="125">Python spatial index</text><text x="375" y="125">Candidates + sort</text><text x="625" y="125">Visibility + water</text><text x="875" y="125">Python features</text></g>
<g font-size="13"><text x="125" y="150">Revision-keyed result cache</text><text x="125" y="173">Read-only maps / target tuples</text><text x="375" y="150">Squared distance, order, x, y</text><text x="375" y="173">Same tuple ordering as Python</text><text x="625" y="150">Ordered rays until k accepted</text><text x="625" y="173">Return relative integer offsets</text><text x="875" y="150">math.hypot + normalization</text><text x="875" y="173">Presence flags + zero padding</text></g>
<g fill="none" stroke="var(--figure-muted)" stroke-width="2" marker-end="url(#arrow)"><path d="M232 144H267"/><path d="M482 144H517"/><path d="M732 144H767"/></g>
<text x="500" y="235" font-size="15">Cache hits, k=1, custom callbacks and older extensions keep their existing paths.</text>
<text x="500" y="263" font-size="14" fill="var(--figure-muted)">No RNG · no precision change · no retained native buffers · no checkpoint / replay format change</text>
</g></svg>
