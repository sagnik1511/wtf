<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Worked activation and sensitivity example</title><desc id="desc">An illustrative policy slice with energy and predator presence flows through two tanh units to two action logits and softmax probabilities. A reverse pass gives signed local input influence for move backward. Numbers are verified using production archived inference, not measurements from a simulation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8ac8ff"/></marker></defs>
