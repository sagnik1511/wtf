<text x="878" y="200" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">rest</text>
<rect x="878" y="214" width="255" height="24" rx="4" fill="#263341"/><rect x="878" y="214" width="113.27" height="24" rx="4" fill="#8ac8ff"/>
<text x="1138" y="234" font-size="16" fill="#e6edf3" text-anchor="end" font-weight="normal">44.4%</text>
<path d="M722 370 H858" fill="none" stroke="#8ac8ff" stroke-width="2" marker-end="url(#arrow)"/>
<text x="878" y="350" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">move backward</text>
<rect x="878" y="364" width="255" height="24" rx="4" fill="#263341"/><rect x="878" y="364" width="141.73" height="24" rx="4" fill="#7de2bd"/>
<text x="1138" y="384" font-size="16" fill="#e6edf3" text-anchor="end" font-weight="normal">55.6%</text>
<text x="30" y="493" font-size="20" fill="#e6edf3" text-anchor="start" font-weight="600">Reverse pass · target = probability of move backward</text>
<text x="30" y="520" font-size="15" fill="#a9bacc" text-anchor="start" font-weight="normal">Input influence = input × local gradient. Positive and negative signs are local effects, not causal shares.</text>
<rect x="30" y="542" width="555" height="80" rx="9" fill="#111c27" stroke="#415569"/>
<text x="46" y="569" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">Energy</text>
<text x="46" y="599" font-size="18" fill="#ff9aab" text-anchor="start" font-weight="normal">0.6 × gradient -0.218 = -0.131</text>
<rect x="615" y="542" width="555" height="80" rx="9" fill="#111c27" stroke="#415569"/>
<text x="631" y="569" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">Predator presence</text>
<text x="631" y="599" font-size="18" fill="#7de2bd" text-anchor="start" font-weight="normal">1.0 × gradient +0.267 = +0.267</text>
<text x="30" y="654" font-size="15" fill="#a9bacc" text-anchor="start" font-weight="normal">Full inference uses every input and connection. A route graph is a bounded display; omitted links still participate.</text>
</g></svg>
