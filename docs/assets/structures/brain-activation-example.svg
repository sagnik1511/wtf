<text x="690" y="139" font-size="17" fill="#e6edf3" text-anchor="middle" font-weight="600">Linear logits</text>
<text x="1008" y="139" font-size="17" fill="#e6edf3" text-anchor="middle" font-weight="600">Softmax probabilities</text>
