<text x="30" y="38" font-size="24" fill="#e6edf3" text-anchor="start" font-weight="600">How weighted inputs become a prediction</text>
<text x="30" y="68" font-size="15" fill="#a9bacc" text-anchor="start" font-weight="normal">Controlled math example · two active inputs; inactive columns and value head omitted · not a captured animal brain</text>
