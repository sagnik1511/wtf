<text x="690" y="277" font-size="14" fill="#a9bacc" text-anchor="middle" font-weight="normal">bias +0.05</text>
<circle cx="690" cy="370" r="30" fill="#1d3442" stroke="#8ac8ff" stroke-width="2"/>
