<rect width="1040" height="759" fill="#101720"/>
<text x="26" y="39" font-size="25" fill="#e6edf3" style="fill:#e6edf3">Observation vector: contiguous blocks and repeated slots</text>
<text x="26" y="68" font-size="14" fill="#acbfd1" style="fill:#acbfd1">Example: observation version 3 with k=4. All positions are zero-based; dimensions follow the actual packing order.</text>
