<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 759" role="img" aria-labelledby="title desc">
<title id="title">Observation vector: contiguous blocks and repeated slots</title><desc id="desc">Example: observation version 3 with k=4. All positions are zero-based; dimensions follow the actual packing order.</desc>
