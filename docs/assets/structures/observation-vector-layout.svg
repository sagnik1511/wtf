<text x="42" y="441" font-size="14" fill="#acbfd1" style="fill:#acbfd1">Missing target: four zero values. A target at the current cell has distance 0 and presence 1.</text>
<rect x="24" y="477" width="310" height="118" rx="7" fill="#192532" stroke="#486077"/>
<text x="179.0" y="504" font-size="17" fill="#8ac8ff" style="fill:#8ac8ff" text-anchor="middle">Version 1</text>
<text x="179.0" y="529" font-size="13" fill="#e6edf3" style="fill:#e6edf3" text-anchor="middle" class="mono" xml:space="preserve">self 8 + targets 12k</text>
<text x="179.0" y="551" font-size="13" fill="#e6edf3" style="fill:#e6edf3" text-anchor="middle" class="mono" xml:space="preserve">k=1 -&gt; 20   k=4 -&gt; 56</text>
<rect x="360" y="477" width="310" height="118" rx="7" fill="#192532" stroke="#486077"/>
<text x="515.0" y="504" font-size="17" fill="#8ac8ff" style="fill:#8ac8ff" text-anchor="middle">Version 2</text>
<text x="515.0" y="529" font-size="13" fill="#e6edf3" style="fill:#e6edf3" text-anchor="middle" class="mono" xml:space="preserve">version 1 + terrain 12</text>
<text x="515.0" y="551" font-size="13" fill="#e6edf3" style="fill:#e6edf3" text-anchor="middle" class="mono" xml:space="preserve">k=1 -&gt; 32   k=4 -&gt; 68</text>
<rect x="696" y="477" width="320" height="118" rx="7" fill="#192532" stroke="#486077"/>
<text x="856.0" y="504" font-size="17" fill="#8ac8ff" style="fill:#8ac8ff" text-anchor="middle">Version 3</text>
<text x="856.0" y="529" font-size="13" fill="#e6edf3" style="fill:#e6edf3" text-anchor="middle" class="mono" xml:space="preserve">version 2 + mating 10</text>
<text x="856.0" y="551" font-size="13" fill="#e6edf3" style="fill:#e6edf3" text-anchor="middle" class="mono" xml:space="preserve">k=1 -&gt; 42   k=4 -&gt; 78</text>
<rect x="24" y="618" width="486" height="93" rx="7" fill="#192532" stroke="#486077"/>
<text x="267.0" y="645" font-size="17" fill="#8ac8ff" style="fill:#8ac8ff" text-anchor="middle">Target slots are per diet category</text>
<text x="267.0" y="670" font-size="13" fill="#e6edf3" style="fill:#e6edf3" text-anchor="middle" class="mono" xml:space="preserve">sort visible targets by distance</text>
<text x="267.0" y="692" font-size="13" fill="#e6edf3" style="fill:#e6edf3" text-anchor="middle" class="mono" xml:space="preserve">they do not identify a commanded attack target</text>
<rect x="530" y="618" width="486" height="93" rx="7" fill="#192532" stroke="#486077"/>
<text x="773.0" y="645" font-size="17" fill="#8ac8ff" style="fill:#8ac8ff" text-anchor="middle">Mating remains one separate summary</text>
<text x="773.0" y="670" font-size="13" fill="#e6edf3" style="fill:#e6edf3" text-anchor="middle" class="mono" xml:space="preserve">same-species / opposite-sex nearest visible mate</text>
<text x="773.0" y="692" font-size="13" fill="#e6edf3" style="fill:#e6edf3" text-anchor="middle" class="mono" xml:space="preserve">readiness and pair opportunity are separate inputs</text>
<text x="26" y="739" font-size="14" fill="#acbfd1" style="fill:#acbfd1">Slot identity can change as targets move. Self, terrain and mating fields are not duplicated for each target.</text>
