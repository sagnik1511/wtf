<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="690" viewBox="0 0 1040 690" role="img" aria-labelledby="title desc"><title id="title">WTF package ownership</title><desc id="desc">A root API and command layer contains six responsibility-based subpackages. Viewer JavaScript and writable results remain separate.</desc><style>svg{--bg:#f6f8fb;--box:#fff;--ink:#182d43;--muted:#506579;--line:#7890a6;--accent:#146b53}text{font-family:system-ui,sans-serif;fill:var(--ink)}.muted{fill:var(--muted)}@media(prefers-color-scheme:dark){svg{--bg:#171c25;--box:#25323f;--ink:#e6edf3;--muted:#b1c1cf;--line:#6b8398;--accent:#7de2bd}}</style><rect width="1040" height="690" rx="16" fill="var(--bg)"/><text x="28" y="40" font-size="24" font-weight="600">wtf — public API and package boundaries</text><rect x="24" y="65" width="992" height="542" rx="12" fill="none" stroke="var(--line)" stroke-width="2"/><text x="46" y="100" font-size="20" font-weight="600">wtf</text><text x="46" y="130" font-size="16" class="muted">Lazy Experiment / load_config · CLI and viewer server · config and assets</text><rect x="44" y="155" width="466" height="120" rx="10" fill="var(--box)" stroke="var(--line)"/><rect x="44" y="155" width="6" height="120" rx="3" fill="var(--accent)"/><text x="66" y="195" font-size="21" font-weight="600">wtf.simulation</text><text x="66" y="232" font-size="16" class="muted">Bodies · terrain · actions · sight</text><rect x="530" y="155" width="466" height="120" rx="10" fill="var(--box)" stroke="var(--line)"/><rect x="530" y="155" width="6" height="120" rx="3" fill="var(--accent)"/><text x="552" y="195" font-size="21" font-weight="600">wtf.learning</text><text x="552" y="232" font-size="16" class="muted">Policies · updates · inherited weights</text><rect x="44" y="298" width="466" height="120" rx="10" fill="var(--box)" stroke="var(--line)"/><rect x="44" y="298" width="6" height="120" rx="3" fill="var(--accent)"/><text x="66" y="338" font-size="21" font-weight="600">wtf.experiment</text><text x="66" y="375" font-size="16" class="muted">Scheduling · lineage · early stopping</text><rect x="530" y="298" width="466" height="120" rx="10" fill="var(--box)" stroke="var(--line)"/><rect x="530" y="298" width="6" height="120" rx="3" fill="var(--accent)"/><text x="552" y="338" font-size="21" font-weight="600">wtf.storage</text><text x="552" y="375" font-size="16" class="muted">Replay · checkpoint · champion records</text><rect x="44" y="441" width="466" height="120" rx="10" fill="var(--box)" stroke="var(--line)"/><rect x="44" y="441" width="6" height="120" rx="3" fill="var(--accent)"/><text x="66" y="481" font-size="21" font-weight="600">wtf.inspection</text><text x="66" y="518" font-size="16" class="muted">Read-only analysis · explanations</text><rect x="530" y="441" width="466" height="120" rx="10" fill="var(--box)" stroke="var(--line)"/><rect x="530" y="441" width="6" height="120" rx="3" fill="var(--accent)"/><text x="552" y="481" font-size="21" font-weight="600">wtf.native</text><text x="552" y="518" font-size="16" class="muted">Numeric helpers · optional CPU kernels</text><text x="28" y="643" font-size="17">Outside the package API: viewer/ JavaScript · environments/ and maps/ JSON</text><text x="28" y="672" font-size="15" class="muted">Installed assets are read-only; results and learned artifacts stay in the working directory.</text></svg>
