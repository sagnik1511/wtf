<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 842" role="img" aria-labelledby="title desc">
<title id="title">Observation cache: shared buckets, private window references</title><desc id="desc">Schematic bucket view, not the animal sight grid. Every bucket covers 8 x 8 world cells; visibility is checked separately.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#9bb5ce"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#e6edf3}.mono{font-family:monospace}</style>
<rect width="1040" height="842" fill="#101720"/>
<text x="26" y="39" font-size="25" fill="#e6edf3" style="fill:#e6edf3">Observation cache: shared buckets, private window references</text>
<text x="26" y="68" font-size="14" fill="#acbfd1" style="fill:#acbfd1">Schematic bucket view, not the animal sight grid. Every bucket covers 8 x 8 world cells; visibility is checked separately.</text>
<rect x="24" y="96" width="474" height="414" rx="7" fill="#14202d" stroke="#486077"/>
<text x="42" y="126" font-size="19" fill="#8ac8ff" style="fill:#8ac8ff">Moving observer: reuse the overlap</text>
<text x="42" y="154" font-size="13" fill="#acbfd1" style="fill:#acbfd1">Dashed: old bounds | Solid: new bounds</text>
<rect x="62" y="179" width="89" height="74" rx="2" fill="#593a30" stroke="#486077"/>
<text x="106" y="206" font-size="14" fill="#e6edf3" style="fill:#e6edf3" text-anchor="middle" class="mono" xml:space="preserve">B0,0</text>
<text x="106" y="232" font-size="11" fill="#acbfd1" style="fill:#acbfd1" text-anchor="middle" class="mono" xml:space="preserve">points / rev</text>
