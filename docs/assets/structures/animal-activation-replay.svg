<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><style id="figure-palette">svg{--figure-0b1118:#0b1118;--figure-111c27:#111c27;--figure-415569:#415569;--figure-7de2bd:#7de2bd;--figure-8ac8ff:#8ac8ff;--figure-a9bacc:#a9bacc;--figure-e6edf3:#e6edf3;}@media(prefers-color-scheme:light){svg{--figure-0b1118:#ffffff;--figure-111c27:#ffffff;--figure-415569:#a2b5c7;--figure-7de2bd:#19714f;--figure-8ac8ff:#1f639c;--figure-a9bacc:#4b6073;--figure-e6edf3:#172c3c;}}</style>
<title id="title">Actual animal activations from training to replay</title><desc id="desc">Every living animal's existing diagnostic forward pass samples hidden activations, and actual recurrent prior memory where applicable. Only visualization values are rounded to FP32 and stored in binary replay chunks. The selected animal's inspector and playback window follow the current diagnostic with no archive or weight inference.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--figure-8ac8ff)"/></marker></defs>
<rect width="1120" height="560" rx="14" fill="var(--figure-0b1118)"/>
<g font-family="system-ui,sans-serif" fill="var(--figure-e6edf3)">
<text x="28" y="36" font-size="22" font-weight="600">Actual animal brain activity · sampled once, followed during replay</text>
<g fill="var(--figure-111c27)" stroke="var(--figure-415569)" stroke-width="1.5"><rect x="28" y="68" width="310" height="245" rx="10"/><rect x="398" y="68" width="310" height="245" rx="10"/><rect x="768" y="68" width="324" height="245" rx="10"/><rect x="28" y="365" width="1064" height="155" rx="10"/></g>
<g font-size="18" font-weight="600"><text x="46" y="99">Every living animal at a sample</text><text x="416" y="99">Existing diagnostic record</text><text x="786" y="99">Selected-animal playback</text><text x="46" y="397">Separate paths and precision boundaries</text></g>
<g font-size="15" fill="var(--figure-a9bacc)"><text x="46" y="135">Own current weights + observation</text><text x="46" y="166">Actual prior memory for recurrent PPO</text><text x="46" y="197">One diagnostic forward pass</text><text x="46" y="228">Retain hidden layers; discard tape</text><text x="46" y="280" fill="var(--figure-7de2bd)">No learning, RNG or memory updates</text><text x="416" y="135">Existing inputs and output scores</text><text x="416" y="166">activations: version + layer arrays</text><text x="416" y="197">Optional prior-memory array</text><text x="416" y="228">FP32 visualization samples only</text><text x="416" y="280" fill="var(--figure-7de2bd)">Binary arrays + existing compression</text><text x="786" y="135">Read one world chunk at a time</text><text x="786" y="166">Select by animal ID / board click</text><text x="786" y="197">Inputs / outputs + rank-k structure</text><text x="786" y="228">Refresh on samples / rank changes</text><text x="786" y="280" fill="var(--figure-7de2bd)">Play / pause / step / backward seek</text><text x="46" y="432">Simulation arithmetic, weights and prediction scores retain their existing precision. No full model snapshots are added.</text><text x="46" y="463">Saved-champion explanations remain optional and separate; they are not used to display the selected animal’s activity.</text><text x="46" y="494">Older recordings show their recorded predictions and an explicit missing-activation message. No hidden values are inferred.</text></g>
<g stroke="var(--figure-8ac8ff)" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M338 185H395"/><path d="M708 185H765"/><path d="M930 313V362"/></g></g></svg>
