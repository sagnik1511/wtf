<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc">
<title id="title">Archived brain explanation data flow</title><desc id="desc">One selected animal's recorded input and a species-sex champion's weights feed stateless inference and reverse-mode sensitivity. Recorded predictions remain a separate historical reference. No simulation or training is restored.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8ac8ff"/></marker></defs>
<rect width="1040" height="470" rx="14" fill="#0b1118"/>
<g font-family="system-ui,sans-serif" fill="#e6edf3"><text x="30" y="35" font-size="21" font-weight="600">One selected animal · one archived model · on-demand analysis</text>
<g stroke="#415569" fill="#111c27" stroke-width="1.5"><rect x="30" y="65" width="280" height="120" rx="9"/><rect x="30" y="215" width="280" height="120" rx="9"/><rect x="380" y="95" width="285" height="210" rx="9"/><rect x="735" y="65" width="275" height="270" rx="9"/><rect x="380" y="355" width="630" height="80" rx="9"/></g>
<g font-size="17" font-weight="600"><text x="47" y="94">Selected replay diagnostic</text><text x="47" y="244">Run-local champion archive</text><text x="398" y="125">Stateless weight analysis</text><text x="753" y="95">Agent inspector window</text><text x="398" y="383">Historical prediction reference</text></g>
<g font-size="14" fill="#a9bacc"><text x="47" y="122">Observation vector + recorded mask</text><text x="47" y="147">Animal / run / body and sample steps</text><text x="47" y="172">Decode one requested chunk</text><text x="47" y="273">Matching species + sex + criterion</text><text x="47" y="298">Load one packed weight blob</text><text x="47" y="323">Display source animal and model step</text><text x="398" y="158">Forward: activations → action scores</text><text x="398" y="187">Reverse: selected score → inputs</text><text x="398" y="216">One request; newest sample queued</text><text x="398" y="245">What-if pins the observation</text><text x="398" y="282" fill="#ffbd75">No live world, optimizer or training</text><text x="753" y="133">Input interpretation / influence</text><text x="753" y="166">Predicted action probabilities</text><text x="753" y="199">Whole structure if rank ≤ k</text><text x="753" y="232">Advanced weighted routes / maps</text><text x="753" y="271" fill="#ffbd75">Archived re-evaluation ≠ historical</text><text x="753" y="294" fill="#ffbd75">selected animal’s exact weights</text><text x="398" y="410">Actual recorded scores shown separately · never overwritten by what-if</text></g>
