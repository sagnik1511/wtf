<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" role="img" aria-labelledby="t d">
<title id="t">Separate recovery and best-brain retention</title><desc id="d">All replay chunks are retained. Full recovery checkpoints reference common static metadata; qualifying best-brain collections reference shared model blobs. Each has its own retention count.</desc>
<style>svg{--bg:#f8fafc;--panel:#fff;--ink:#172b45;--muted:#52657b;--line:#8ca0b7;--accent:#166c61}@media(prefers-color-scheme:dark){svg{--bg:#171b22;--panel:#26313e;--ink:#e5eaf1;--muted:#b2bfce;--line:#879db4;--accent:#70d5bb}}text{font:16px system-ui,sans-serif;fill:var(--ink)}.h{font-size:21px;font-weight:650}.s{font-size:14px;fill:var(--muted)}.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.arrow{fill:none;stroke:var(--accent);stroke-width:2;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="var(--accent)"/></marker></defs><rect width="1080" height="660" fill="var(--bg)"/>
<text class="h" x="30" y="36">One simulation, three independent artifact paths</text>
<rect class="box" x="30" y="65" width="1020" height="75" rx="10"/><text class="h" x="50" y="95">Independent animal learning + world progression</text><text class="s" x="50" y="121">Same actions, feedback, RNG order and viewer frames. Persistence does not change selection.</text>
<path class="arrow" d="M190 140V174"/><path class="arrow" d="M540 140V174"/><path class="arrow" d="M890 140V174"/>
<rect class="box" x="30" y="182" width="320" height="165" rx="10"/><text class="h" x="50" y="212">Playback and reports</text><text x="50" y="244">Every recorded run and chunk</text><text x="50" y="273">Metrics + prediction samples</text><text class="s" x="50" y="304">Retain all; no retention deletion.</text><text class="s" x="50" y="326">Viewer behavior remains the same.</text>
<rect class="box" x="380" y="182" width="320" height="165" rx="10"/><text class="h" x="400" y="212">Recovery checkpoints</text><text x="400" y="244">World + optimizer + buffers + RNG</text><text x="400" y="273">Rolling latest N successful files</text><text class="s" x="400" y="304">Periodic, run boundary and final.</text><text class="s" x="400" y="326">Resume the complete experiment.</text>
<rect class="box" x="730" y="182" width="320" height="165" rx="10"/><text class="h" x="750" y="212">Periodic best brains</text><text x="750" y="244">Strictly better rank + new weights</text><text x="750" y="273">Keep K qualifying best collections</text><text class="s" x="750" y="304">Check every configured step interval.</text><text class="s" x="750" y="326">Warm start; fresh learning state.</text>
<path class="arrow" d="M540 347V381"/><path class="arrow" d="M890 347V381"/>
<rect class="box" x="380" y="389" width="320" height="150" rx="10"/><text class="h" x="400" y="421">Common metadata pool</text><text x="400" y="453">Config · actions · signatures</text><text class="s" x="400" y="485">Immutable content hashes; no deltas.</text><text class="s" x="400" y="513">Keep beside version-4 checkpoints.</text>
<rect class="box" x="730" y="389" width="320" height="150" rx="10"/><text class="h" x="750" y="421">Periodic weight pool</text><text x="750" y="453">Lossless model blobs + latest index</text><text class="s" x="750" y="485">Reused across retained collections.</text><text class="s" x="750" y="513">Remove only unreferenced owned blobs.</text>
<rect class="box" x="30" y="566" width="1020" height="65" rx="9"/><text x="50" y="593">Numbered end-of-run brain archives remain separate and are all retained.</text><text class="s" x="50" y="616">No pre-existing artifacts are pruned. Self-contained v3 output remains available.</text>
</svg>
