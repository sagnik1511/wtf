<text x="42" y="681" font-size="14" fill="var(--figure-acbfd1)" style="fill:var(--figure-acbfd1)" class="mono" xml:space="preserve">Decode by row: {id:7, x:3, health:50.0}, then {id:8, x:4, health:45.0}, ...</text>
<text x="26" y="735" font-size="14" fill="var(--figure-acbfd1)" style="fill:var(--figure-acbfd1)">Delta field tables define mask bits. Entity column tables define row shape. These are separate encoding layers.</text>
