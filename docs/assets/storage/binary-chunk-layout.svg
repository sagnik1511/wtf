<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 770" role="img" aria-labelledby="title desc"><style id="figure-palette">svg{--figure-101720:#101720;--figure-14202d:#14202d;--figure-192532:#192532;--figure-23364a:#23364a;--figure-2c4056:#2c4056;--figure-486077:#486077;--figure-7de2bd:#7de2bd;--figure-8ac8ff:#8ac8ff;--figure-9bb5ce:#9bb5ce;--figure-acbfd1:#acbfd1;--figure-e6edf3:#e6edf3;}@media(prefers-color-scheme:light){svg{--figure-101720:#f5f8fb;--figure-14202d:#f8fafc;--figure-192532:#f0f4f8;--figure-23364a:#e3edf7;--figure-2c4056:#e1eaf3;--figure-486077:#a2b5c7;--figure-7de2bd:#19714f;--figure-8ac8ff:#1f639c;--figure-9bb5ce:#415b70;--figure-acbfd1:#4b6073;--figure-e6edf3:#172c3c;}}</style>
<title id="title">Binary chunk: nested records and typed columns</title><desc id="desc">One .bin.xz chunk wraps this independently decodable structure. Block widths are schematic, not byte lengths.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="var(--figure-9bb5ce)"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:var(--figure-e6edf3)}.mono{font-family:monospace}</style>
<rect width="1040" height="770" fill="var(--figure-101720)"/>
<text x="26" y="39" font-size="25" fill="var(--figure-e6edf3)" style="fill:var(--figure-e6edf3)">Binary chunk: nested records and typed columns</text>
<text x="26" y="68" font-size="14" fill="var(--figure-acbfd1)" style="fill:var(--figure-acbfd1)">One .bin.xz chunk wraps this independently decodable structure. Block widths are schematic, not byte lengths.</text>
<rect x="24" y="96" width="992" height="245" rx="7" fill="var(--figure-14202d)" stroke="var(--figure-486077)"/>
<text x="42" y="125" font-size="17" fill="var(--figure-8ac8ff)" style="fill:var(--figure-8ac8ff)">XZ-compressed file container  -&gt;  decompress this chunk only</text>
<rect x="42" y="162" width="110" height="107" rx="7" fill="var(--figure-192532)" stroke="var(--figure-486077)"/>
<text x="97.0" y="189" font-size="17" fill="var(--figure-8ac8ff)" style="fill:var(--figure-8ac8ff)" text-anchor="middle">Prefix</text>
<text x="97.0" y="214" font-size="13" fill="var(--figure-e6edf3)" style="fill:var(--figure-e6edf3)" text-anchor="middle" class="mono" xml:space="preserve">WTFB</text>
<text x="97.0" y="236" font-size="13" fill="var(--figure-e6edf3)" style="fill:var(--figure-e6edf3)" text-anchor="middle" class="mono" xml:space="preserve">01</text>
<text x="97.0" y="258" font-size="13" fill="var(--figure-e6edf3)" style="fill:var(--figure-e6edf3)" text-anchor="middle" class="mono" xml:space="preserve">5 bytes total</text>
<rect x="170" y="162" width="190" height="107" rx="7" fill="var(--figure-192532)" stroke="var(--figure-486077)"/>
<rect x="170" y="162" width="190" height="29" rx="2" fill="var(--figure-2c4056)" stroke="var(--figure-486077)"/>
<text x="265" y="182" font-size="12" fill="var(--figure-acbfd1)" style="fill:var(--figure-acbfd1)" text-anchor="middle" class="mono" xml:space="preserve">uint32_le length</text>
<text x="265" y="219" font-size="20" fill="var(--figure-7de2bd)" style="fill:var(--figure-7de2bd)" text-anchor="middle">Header</text>
<text x="265" y="247" font-size="13" fill="var(--figure-e6edf3)" style="fill:var(--figure-e6edf3)" text-anchor="middle" class="mono" xml:space="preserve">kind: replay</text>
<rect x="378" y="162" width="190" height="107" rx="7" fill="var(--figure-192532)" stroke="var(--figure-486077)"/>
<rect x="378" y="162" width="190" height="29" rx="2" fill="var(--figure-2c4056)" stroke="var(--figure-486077)"/>
<text x="473" y="182" font-size="12" fill="var(--figure-acbfd1)" style="fill:var(--figure-acbfd1)" text-anchor="middle" class="mono" xml:space="preserve">uint32_le length</text>
<text x="473" y="219" font-size="20" fill="var(--figure-7de2bd)" style="fill:var(--figure-7de2bd)" text-anchor="middle">Keyframe</text>
<text x="473" y="247" font-size="13" fill="var(--figure-e6edf3)" style="fill:var(--figure-e6edf3)" text-anchor="middle" class="mono" xml:space="preserve">full first frame</text>
<rect x="586" y="162" width="190" height="107" rx="7" fill="var(--figure-192532)" stroke="var(--figure-486077)"/>
<rect x="586" y="162" width="190" height="29" rx="2" fill="var(--figure-2c4056)" stroke="var(--figure-486077)"/>
<text x="681" y="182" font-size="12" fill="var(--figure-acbfd1)" style="fill:var(--figure-acbfd1)" text-anchor="middle" class="mono" xml:space="preserve">uint32_le length</text>
<text x="681" y="219" font-size="20" fill="var(--figure-7de2bd)" style="fill:var(--figure-7de2bd)" text-anchor="middle">Deltas</text>
<text x="681" y="247" font-size="13" fill="var(--figure-e6edf3)" style="fill:var(--figure-e6edf3)" text-anchor="middle" class="mono" xml:space="preserve">N-1 patch packets</text>
<rect x="794" y="162" width="190" height="107" rx="7" fill="var(--figure-192532)" stroke="var(--figure-486077)"/>
<rect x="794" y="162" width="190" height="29" rx="2" fill="var(--figure-2c4056)" stroke="var(--figure-486077)"/>
<text x="889" y="182" font-size="12" fill="var(--figure-acbfd1)" style="fill:var(--figure-acbfd1)" text-anchor="middle" class="mono" xml:space="preserve">uint32_le length</text>
<text x="889" y="219" font-size="20" fill="var(--figure-7de2bd)" style="fill:var(--figure-7de2bd)" text-anchor="middle">Footer</text>
<text x="889" y="247" font-size="13" fill="var(--figure-e6edf3)" style="fill:var(--figure-e6edf3)" text-anchor="middle" class="mono" xml:space="preserve">frames: N</text>
<path d="M152 218H169" fill="none" stroke="var(--figure-9bb5ce)" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M360 218H377" fill="none" stroke="var(--figure-9bb5ce)" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M568 218H585" fill="none" stroke="var(--figure-9bb5ce)" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M776 218H793" fill="none" stroke="var(--figure-9bb5ce)" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="42" y="309" font-size="14" fill="var(--figure-acbfd1)" style="fill:var(--figure-acbfd1)">Each length counts the next payload only. The file-local symbol dictionary is shared by all records.</text>
<path d="M473 269V366" fill="none" stroke="var(--figure-9bb5ce)" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="490" y="359" font-size="13" fill="var(--figure-acbfd1)" style="fill:var(--figure-acbfd1)">inside a frame payload</text>
<rect x="24" y="381" width="992" height="320" rx="7" fill="var(--figure-14202d)" stroke="var(--figure-486077)"/>
<text x="42" y="411" font-size="18" fill="var(--figure-8ac8ff)" style="fill:var(--figure-8ac8ff)">Entity table (tag 11): metadata + one column per field</text>
<rect x="42" y="438" width="120" height="75" rx="7" fill="var(--figure-192532)" stroke="var(--figure-486077)"/>
<text x="102.0" y="465" font-size="17" fill="var(--figure-8ac8ff)" style="fill:var(--figure-8ac8ff)" text-anchor="middle">Tag</text>
<text x="102.0" y="490" font-size="13" fill="var(--figure-e6edf3)" style="fill:var(--figure-e6edf3)" text-anchor="middle" class="mono" xml:space="preserve">11 = table</text>
<rect x="180" y="438" width="135" height="75" rx="7" fill="var(--figure-192532)" stroke="var(--figure-486077)"/>
<text x="247.5" y="465" font-size="17" fill="var(--figure-8ac8ff)" style="fill:var(--figure-8ac8ff)" text-anchor="middle">Row count</text>
<text x="247.5" y="490" font-size="13" fill="var(--figure-e6edf3)" style="fill:var(--figure-e6edf3)" text-anchor="middle" class="mono" xml:space="preserve">4</text>
<rect x="42" y="539" width="273" height="115" rx="7" fill="var(--figure-192532)" stroke="var(--figure-486077)"/>
<text x="178.5" y="566" font-size="17" fill="var(--figure-8ac8ff)" style="fill:var(--figure-8ac8ff)" text-anchor="middle">Field-name list</text>
<text x="178.5" y="591" font-size="13" fill="var(--figure-e6edf3)" style="fill:var(--figure-e6edf3)" text-anchor="middle" class="mono" xml:space="preserve">id | x | health</text>
<text x="178.5" y="613" font-size="13" fill="var(--figure-e6edf3)" style="fill:var(--figure-e6edf3)" text-anchor="middle" class="mono" xml:space="preserve">preserves field order</text>
<text x="178.5" y="635" font-size="13" fill="var(--figure-e6edf3)" style="fill:var(--figure-e6edf3)" text-anchor="middle" class="mono" xml:space="preserve">column 0 / 1 / 2</text>
