[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wtf-wildlife-trial-framework"
version = "0.0.2.9"
description = "WTF — Wildlife Trial Framework: a reinforcement learning ecosystem simulator"
readme = "PYPI_README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sagnik Roy"}]
requires-python = ">=3.12"
dependencies = ["tqdm>=4.66,<5"]
keywords = ["reinforcement-learning", "wtf", "simulation", "multi-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/sagnik1511/wtf"
Documentation = "https://sagnik1511.github.io/wtf/"
Source = "https://github.com/sagnik1511/wtf"
Issues = "https://github.com/sagnik1511/wtf/issues"

[project.scripts]
wtf = "wtf.commands:main"
wtf-run = "wtf.cli:main"
wtf-view = "wtf.server:main"
wtf-analyze = "wtf.inspection.analyze:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["wtf", "wtf.*"]

[tool.setuptools.package-data]
"wtf.native" = ["_kernels*.c", "_kernels*.h", "_cuda_dqn.cu"]
