# Public documentation configuration. Build through python -m work.build_docs.
[project]
site_name = "WTF — Wildlife Trial Framework"
site_description = "Configure, train, inspect and extend independently learning ecosystems."
site_url = "https://sagnik1511.github.io/wtf/"
repo_url = "https://github.com/sagnik1511/wtf"
repo_name = "sagnik1511/wtf"
edit_uri = "edit/main/docs/"
copyright = "Copyright © 2026 Sagnik Roy · MIT License"
# Generated public-only staging; the wrapper selects canonical sources from docs/.
docs_dir = ".cache/docs-build/docs"
site_dir = ".cache/docs-site"
strict = true
extra_css = [
    "stylesheets/documentation.css",
]
extra_javascript = [
    "javascripts/banner-theme.js",
]

[project.theme]
custom_dir = "docs/overrides"
logo = "assets/branding/wtf-symbol-light.svg"
favicon = "assets/branding/favicon.svg"
language = "en"
font = false
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.indexes",
    "navigation.top",
    "navigation.footer",
    "search.suggest",
    "search.highlight",
    "content.code.copy",
    "content.action.edit",
]
variant = "classic"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "cyan"

[project.theme.palette.toggle]
icon = "material/weather-night"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "cyan"

[project.theme.palette.toggle]
icon = "material/weather-sunny"
name = "Switch to light mode"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.tables]

[project.markdown_extensions.fenced_code]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true

[project.markdown_extensions."pymdownx.superfences"]

[[project.nav]]
Home = "index.md"

